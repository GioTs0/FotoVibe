[project]
name = "fotovibe"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "google-cloud-storage>=3,<4",
  "pillow>=11,<13", "pillow-heif>=1,<2", "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
